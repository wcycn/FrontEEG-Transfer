[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fronteeg-transfer"
version = "0.1.0"
description = "Participant-independent Fp1/Fp2 workload decoding study"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "mne>=1.6",
  "numpy>=1.24",
  "POT>=0.9",
  "pyriemann>=0.6",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "torch-geometric>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "EXE"]
